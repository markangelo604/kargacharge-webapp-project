<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Owner | KargaCharge</title>
    <link rel="icon" type="image/png" href="../assets/images/kargacharge-logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/provider-dashboard.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Tab Content Container -->
        <div class="tab-content-wrapper">
            <!-- Map Tab -->
            <div class="tab-content active" id="mapTab">
                <!-- Map -->
                <div class="map-container">
                    <div id="map" style="height: 100%; width: 100%;"></div>
                    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDFdM5_B57taGitBmG7tpls3MbUyJSnM_w&callback=initMap" async defer></script>
                </div>

                <!-- Search bar -->
                <div class="search-container">
                    <div class="search-wrapper">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                        </svg>
                        <input type="text" class="search-input" placeholder="Search" id="searchInput">
                        <button class="notification-btn" id="notificationBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bell-fill" viewBox="0 0 16 16">
                                <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2m.995-14.901a1 1 0 1 0-1.99 0A5 5 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Map Controls -->
                <div class="map-controls">
                    <button class="control-btn layers-btn" id="layersBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-layers" viewBox="0 0 16 16">
                            <path d="M8.235 1.559a.5.5 0 0 0-.47 0l-7.5 4a.5.5 0 0 0 0 .882L3.188 8 .264 9.559a.5.5 0 0 0 0 .882l7.5 4a.5.5 0 0 0 .47 0l7.5-4a.5.5 0 0 0 0-.882L12.813 8l2.922-1.559a.5.5 0 0 0 0-.882zm3.515 7.008L14.438 10 8 13.433 1.562 10 4.25 8.567l3.515 1.874a.5.5 0 0 0 .47 0zM8 9.433 1.562 6 8 2.567 14.438 6z"/>
                        </svg>
                    </button>
                    <button class="control-btn location-btn" id="locationBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bullseye" viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                            <path d="M8 13A5 5 0 1 1 8 3a5 5 0 0 1 0 10m0 1A6 6 0 1 0 8 2a6 6 0 0 0 0 12"/>
                            <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8"/>
                            <path d="M9.5 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Account Tab -->
            <div class="tab-content" id="accountTab">
                <div class="account-container">
                    <!-- Account Header -->
                    <div class="account-header">
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-tab="mapTab">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt-fill" viewBox="0 0 16 16">
                    <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
                </svg>
                <span>Map</span>
            </div>
            <div class="nav-item" data-tab="addLocTab">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a.5.5 0 0 1 .5.5V7h3a.5.5 0 0 1 0 1H8.5v3a.5.5 0 0 1-1 0V8H4a.5.5 0 0 1 0-1h3.5V3.5A.5.5 0 0 1 8 3z"/>
                    </svg>
                </div>
                <span>Add Loc</span>
            </div>
            <div class="nav-item" data-tab="editTab">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                        <path d="M12.146 0a2 2 0 0 1 1.415.586l2.828 2.828a2 2 0 0 1 0 2.828l-7 7a2 2 0 0 1-1.415.586h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 .586-1.415l7-7A2 2 0 0 1 6 0h4a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <span>Edit</span>
            </div>
            <div class="nav-item" data-tab="accountTab">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                </svg>
                <span>Account</span>
            </div>
        </nav>
    </div>

    <script src="../js/client-dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    // JS for MAP (NOTE: REQUIRED TO MAKE API WORK, "TO REMODIFIED TO PROVIDER.js?")
    function initMap() {
        // Map Options
        var mapOptions = {
            center: { lat: 16.4023, lng: 120.5960 },  //CENTER of the Map
            zoom: 15,  // Zoom level for Baguio City
            mapTypeId: 'roadmap',  // Map Type Roads
            streetViewControl: false, // to avoid user from using Street View Mode. 
            styles: [ // removes other things on the map to make it look less messy
            
                {
                    "featureType": "all",
                    "elementType": "labels",
                    "stylers": [
                        {
                            "visibility": "off"  // Hide all labels (POIs, etc.)
                        }
                    ]
                },
                {
                    "featureType": "poi.business",
                    "elementType": "geometry",
                    "stylers": [
                        {
                            "visibility": "off"  // Hide businesses like restaurants, shops, etc.
                        }
                    ]
                },
                {
                    "featureType": "poi.place_of_worship",
                    "elementType": "geometry",
                    "stylers": [
                        {
                            "visibility": "off"  // Hide places of worship (churches, temples, etc.)
                        }
                    ]
                },
                {
                    "featureType": "poi.school",
                    "elementType": "geometry",
                    "stylers": [
                        {
                            "visibility": "off"  // Hide schools
                        }
                    ]
                },
                {
                    "featureType": "poi.sports_complex",
                    "elementType": "geometry",
                    "stylers": [
                        {
                            "visibility": "off"  // Hide sports complexes
                        }
                    ]
                },
                {
                    "featureType": "poi.park",
                    "elementType": "geometry",
                    "stylers": [
                        {
                            "visibility": "off"  // Hide parks
                        }
                    ]
                },
                {
                    "featureType": "road",
                    "elementType": "geometry",
                    "stylers": [
                        {
                            "visibility": "on"  // Ensure roads are visible
                        }
                    ]
                },
                {
                    "featureType": "road",
                    "elementType": "labels",
                    "stylers": [
                        {
                            "visibility": "on"  // Show road labels (names)
                        }
                    ]
                }
            ]
        };

        // Create the map inside the 'map' div
        var map = new google.maps.Map(document.getElementById('map'), mapOptions);
        
        // Sample Marker, shows Mary Heights. 
        var marker = new google.maps.Marker({
            position: { lat: 16.4010, lng: 120.5921 },  // SLU Mary Heights coordinates
            map: map,
            title: 'SLU Mary Heights'
        });
    }
</script>
    
</body>
</html>
